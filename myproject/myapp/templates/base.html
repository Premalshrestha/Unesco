<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Food Quiz {% endblock title %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .quiz-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      .question-card {
        margin-bottom: 20px;
      }
      .option-btn {
        margin: 5px 0;
        width: 100%;
        text-align: left;
      }
      .correct {
        background-color: #d4edda;
        border-color: #c3e6cb;
      }
      .incorrect {
        background-color: #f8d7da;
        border-color: #f5c6cb;
      }
      .score-display {
        font-size: 2em;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Food Quiz</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{% url 'quiz_history' %}">My History</a>
        </div>
      </div>
    </nav>

    <div class="container mt-4">{% block content %} {% endblock content %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %} {% endblock scripts %}
  </body>
</html>
